apiVersion: v1
kind: ConfigMap
metadata:
  name: customers-config
  namespace: cafe-boreal
data:
  DB_HOST: "postgres-service.cafe-boreal.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "cafeboreal"
  DB_USER: "postgres"
  PORT: "3003"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customers-api
  namespace: cafe-boreal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: customers-api
  template:
    metadata:
      labels:
        app: customers-api
    spec:
      containers:
      - name: customers-api
        image: customers-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 3003
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: customers-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: customers-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: customers-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: customers-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: encryption-secret
              key: encryption_key
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: customers-config
              key: PORT
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 3003
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /healthz
            port: 3003
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: customers-service
  namespace: cafe-boreal
spec:
  selector:
    app: customers-api
  ports:
  - port: 3003
    targetPort: 3003
  type: ClusterIP
